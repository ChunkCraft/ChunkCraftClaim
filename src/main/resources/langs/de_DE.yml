# > Hilfe-Nachrichten

help-separator: "§e§m                                                                      "

help-command:
  claim-claim: |
    §bSyntax : §f/claim [<radius>]
    §bBeschreibung : §fEinige Chunks claimen
  claim-see: |
    §bSyntax : §f/claim see [<spieler>]
    §bBeschreibung : §fLässt Partikel um den Chunk, in dem du dich befindest / die Claims des Spielers erscheinen
  claim-list: |
    §bSyntax : §f/claim list
    §bBeschreibung : §fÖffnet die GUI mit der Liste deiner Claims
  claim-members: |
    §bSyntax : §f/claim members [<claim-name>]
    §bBeschreibung : §fÖffnet die GUI mit den Mitgliedern des aktuellen/angegebenen Claims
  claim-settings: |
    §bSyntax : §f/claim settings [<claim-name>]
    §bBeschreibung : §fÖffnet die GUI mit den Einstellungen des aktuellen/angegebenen Claims
  claim-setspawn: |
    §bSyntax : §f/claim setspawn
    §bBeschreibung : §fLegt den neuen Spawn-Punkt des aktuellen Claims fest
  claim-autoclaim: |
    §bSyntax : §f/claim autoclaim
    §bBeschreibung : §fAktiviert oder deaktiviert den Auto-Claim beim Chunk-Wechsel
  claim-automap: |
    §bSyntax : §f/claim map/automap
    §bBeschreibung : §fZeigt die Claim-Karte / automatisch beim Chunk-Wechsel
  claim-autofly: |
    §bSyntax : §f/claim fly/autofly
    §bBeschreibung : §fAktiviert Claim-Fliegen / automatisch beim Chunk-Wechsel
  claim-tp: |
    §bSyntax : §f/claim tp <claim-name>
    §bBeschreibung : §fTeleportiert zu einem deiner Claims
  claim-setname: |
    §bSyntax : §f/claim setname <alter-claim-name> <neuer-claim-name>
    §bBeschreibung : §fÄndert den Namen des angegebenen Claims
  claim-add: |
    §bSyntax : §f/claim add [<*|claim-name>] <spieler>
    §bBeschreibung : §fFügt einen Spieler zu einem/allen deinen Claims hinzu
  claim-remove: |
    §bSyntax : §f/claim remove [<*|claim-name>] <spieler>
    §bBeschreibung : §fEntfernt einen Spieler aus einem/allen deinen Claims
  claim-setdesc: |
    §bSyntax : §f/claim setdesc <claim-name> <beschreibung>
    §bBeschreibung : §fÄndert die Beschreibung des angegebenen Claims
  claim-chat: |
    §bSyntax : §f/claim chat <claim-name>
    §bBeschreibung : §fÄndert deinen Chat-Modus
  claim-ban: |
    §bSyntax : §f/claim ban [<*|claim-name>] <spieler>
    §bBeschreibung : §fBannt einen Spieler von deinem Claim
  claim-unban: |
    §bSyntax : §f/claim unban [<*|claim-name>] <spieler>
    §bBeschreibung : §fEntbannt einen Spieler von deinem Claim
  claim-bans: |
    §bSyntax : §f/claim bans [<claim-name>]
    §bBeschreibung : §fÖffnet die Sperren-GUI eines Claims
  claim-owner: |
    §bSyntax : §f/claim owner [<*|claim-name>] <spieler>
    §bBeschreibung : §fÜberträgt die Besitzrechte von Claim(s) an einen Spieler
  claim-merge: |
    §bSyntax : §f/claim merge <claim-name-1> <claim-name-2>
    §bBeschreibung : §fFügt zwei Claims zu einem zusammen
  claim-sell: |
    §bSyntax : §f/claim sell <claim-name> <preis>
    §bBeschreibung : §fBietet einen Claim zum Verkauf an
  claim-cancel: |
    §bSyntax : §f/claim cancel <claim-name>
    §bBeschreibung : §fBricht den Verkauf des angegebenen Claims ab
  claim-kick: |
    §bSyntax : §f/claim kick [<*|claim-name>] <spieler>
    §bBeschreibung : §fKickt einen Spieler physisch aus einem Claim
  claim-addchunk: |
    §bSyntax : §f/claim addchunk <claim-name>
    §bBeschreibung : §fFügt einen Chunk zu einem Claim hinzu
  claim-delchunk: |
    §bSyntax : §f/claim delchunk <claim-name> <chunk>
    §bBeschreibung : §fEntfernt einen Chunk aus einem Claim, verwende als Chunk-Argument welt;x;z
  claim-main: |
    §bSyntax : §f/claim main <claim-name>
    §bBeschreibung : §fÖffnet das Hauptmenü eines Claims
  claim-cancelinv: |
    §bSyntax : §f/claim cancelinv <spieler>
    §bBeschreibung : §fBricht die Einladung eines Spielers ab
  claim-accept: |
    §bSyntax : §f/claim accept <spieler>
    §bBeschreibung : §fNimmt die Einladung eines Spielers an
  claim-deny: |
    §bSyntax : §f/claim deny <spieler>
    §bBeschreibung : §fLehnt die Einladung eines Spielers ab
  unclaim-unclaim: |
    %help-separator%
    §bSyntax : §f/unclaim [<claim-name|*>]
    §bBeschreibung :§f Einige Chunks freigeben
